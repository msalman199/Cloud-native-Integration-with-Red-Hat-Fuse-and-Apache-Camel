# Camel Main Configuration
camel.main.name=CamelActiveMQIntegration
camel.main.duration-max-messages=100
camel.main.duration-max-seconds=300

# ActiveMQ Configuration
activemq.broker.url=tcp://localhost:61616
activemq.username=admin
activemq.password=admin
activemq.pool.max-connections=10

# JMS Configuration
jms.concurrent-consumers=3
jms.max-concurrent-consumers=10
jms.receive-timeout=5000

# Logging Configuration
logging.level.com.alnafi.camel.activemq=DEBUG
logging.level.org.apache.camel=INFO
logging.level.org.apache.activemq=INFO
